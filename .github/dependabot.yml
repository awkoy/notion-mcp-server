version: 2
updates:
  # npm dependencies. The cooldown mirrors .npmrc's min-release-age=7 so
  # Dependabot won't open a PR for a release that's less than a week old.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions — keep the SHA pins current (Dependabot bumps SHA + comment).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Docker base image — bumps the pinned node:24-alpine digest in a reviewed PR.
  # Major bumps are ignored on purpose: odd Node majors (25, 27, ...) are
  # 6-month non-LTS lines, so the next move is 24 -> 26 by hand once 26 enters
  # LTS (October 2026). Digest refreshes within 24-alpine still flow through.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
