name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engines floor and the version the release jobs build on.
        node: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        # `npm ci` (not `npm install`): install exactly what package-lock.json
        # says. `npm install` re-resolves and rewrites the lock in place, so CI
        # was testing a tree that could differ from the reviewed lockfile — and
        # a Dependabot bump could be silently undone by the resolver before a
        # single test ran.
        #
        # --ignore-scripts blocks dependency lifecycle scripts, the primary npm
        # malware vector. Nothing legitimate in our tree needs install scripts.
        #
        # No npm upgrade step here any more: min-release-age in .npmrc gates
        # resolution, and `npm ci` does not resolve.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        # Fail the build on a high/critical advisory in a shipped (runtime) dep.
        # Dev-only advisories are tracked by Dependabot but don't block PRs.
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck and build
        run: npm run build

      - name: Run tests
        run: npm test

  docker:
    # Builds the image the release would push (amd64 only, nothing pushed), so
    # a Dockerfile or .dockerignore change breaks the PR instead of the tag.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: notion-mcp-server:ci

      - name: Smoke test
        # --help exits without a token; LICENSE has to ship in the image.
        run: |
          docker run --rm notion-mcp-server:ci --help
          docker run --rm --entrypoint sh notion-mcp-server:ci -c 'test -f LICENSE'
