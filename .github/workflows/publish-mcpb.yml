name: Publish Claude Desktop extension (.mcpb)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release / upload the asset

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        # Same supply-chain posture as publish-npm.yml: install exactly what the
        # lockfile pins, and no lifecycle scripts.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Pack .mcpb
        run: node scripts/build-mcpb.mjs

      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/notion-mcp-server.mcpb --clobber
