name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # ships with npm >= 11.5 (required for Trusted Publishing)
          registry-url: "https://registry.npmjs.org"

      - name: Pin npm
        # Kept (unlike in ci.yml) because publishing has its own reason to be on
        # a known npm: Trusted Publishing / OIDC provenance needs >= 11.5.
        # Pinned rather than @latest: the step that holds the publish token
        # should not run whatever npm release landed minutes ago. Bump it by
        # hand, to a release at least a week old.
        run: npm install -g npm@11.21.0

      - name: Install dependencies
        # `npm ci` (not `npm install`): the published tarball must be built and
        # tested against exactly the reviewed lockfile. `npm install` re-resolves
        # the graph and rewrites the lock in place, so what we shipped was built
        # from a tree nobody reviewed.
        #
        # The previous comment here said npm 11+ strict mode rejected the
        # lockfile for missing Linux-only optional native deps. That is no longer
        # true — the committed lock carries them (@rolldown/binding-linux-*,
        # lightningcss-linux-*, @emnapi/core), and `npm ci` resolves it on
        # ubuntu-latest in CI.
        #
        # --ignore-scripts blocks dependency lifecycle scripts (pre/post-install),
        # the primary npm malware vector (Shai-Hulud, TrapDoor). Our runtime deps
        # have no native build step, so nothing legitimate needs them here; our own
        # build runs explicitly via `npm publish` -> `prepare` below.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        # tests/cli.test.ts spawns build/index.js, so the build must exist
        # before the tests run — the same order as ci.yml. `npm publish` still
        # rebuilds through `prepare`, so what ships is built from the same tree.
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish to npm
        # Idempotent: a version already on the registry is left alone instead of
        # failing the run with EPUBLISHCONFLICT, so the workflow can be re-run by
        # hand when a later step fails — as the MCP Registry step did for v3.1.0,
        # after npm itself had accepted the tarball.
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; skipping publish."
          else
            npm publish
          fi

      - name: Sync server.json version with package.json
        # The registry rejects a `version` field on an OCI package, so the
        # Docker image carries its version as the tag in `identifier`.
        run: |
          node -e "
            const fs = require('fs');
            const { version } = require('./package.json');
            const s = JSON.parse(fs.readFileSync('server.json', 'utf8'));
            s.version = version;
            for (const p of s.packages) {
              if (p.registryType === 'oci') p.identifier = p.identifier.replace(/:[^:/]+$/, ':' + version);
              else p.version = version;
            }
            fs.writeFileSync('server.json', JSON.stringify(s, null, 2) + '\n');
          "

      - name: Install mcp-publisher
        # Pinned to a release and checked against its sha256 (from that
        # release's registry_<version>_checksums.txt) before it runs with this
        # job's OIDC token. To bump: change both values together.
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Wait for npm to serve the published version
        # npm's publish pipeline is asynchronous: `npm publish` returns "your
        # package is being processed" and the version is not fetchable yet. The
        # MCP Registry validates our package against what registry.npmjs.org
        # serves, so registering too early fails with "version was not found".
        # v3.1.0 took about sixteen minutes to appear — far past the five
        # minutes of retries the step below carried on its own, which failed the
        # release run even though the npm publish had succeeded.
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$NAME/$VERSION")
            if [ "$code" = "200" ]; then
              echo "npm serves $NAME@$VERSION (after $(( (i - 1) * 30 ))s)."
              exit 0
            fi
            sleep 30
          done
          echo "::error::npm did not serve $NAME@$VERSION within 20 minutes."
          exit 1

      - name: Wait for GHCR to serve the Docker image
        # server.json also lists the Docker image, which publish-docker.yml
        # builds from the same tag in parallel with this run. The registry
        # checks that the image tag exists and carries the
        # io.modelcontextprotocol.server.name label, so registering before that
        # push finishes fails.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IMAGE="ghcr.io/awkoy/notion-mcp-server:$VERSION"
          for i in $(seq 1 40); do
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              echo "GHCR serves $IMAGE (after $(( (i - 1) * 30 ))s)."
              exit 0
            fi
            sleep 30
          done
          echo "::error::GHCR did not serve $IMAGE within 20 minutes."
          exit 1

      - name: Publish to MCP Registry
        # Still retried: the registry validates the mcpName field against the
        # package.json served by npm, and its own view of that registry can lag
        # the check above by a few seconds.
        run: |
          ./mcp-publisher login github-oidc
          for i in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "Publish attempt $i failed, retrying in 60s..."
            sleep 60
          done
          exit 1
